<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ModelDirector - stateless AI model selection engine">
  <title>ModelDirector</title>
  <desc>Prompt is scored against candidate models; the policy engine picks the cheapest capable one.</desc>

  <defs>
    <!-- Grid background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- Radial glow for the centre -->
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#centreGlow)"/>

  <!-- Wordmark + tagline -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace">
    <text x="60" y="80" font-size="42" font-weight="700" fill="#e2e8f0">Model<tspan fill="#34d399">Director</tspan></text>
    <text x="60" y="112" font-size="14" fill="#94a3b8">stateless AI model selection engine</text>
    <text x="60" y="132" font-size="12" fill="#64748b">"which model should handle this request?"</text>
  </g>

  <!-- Top-right status pill -->
  <g transform="translate(1010, 56)" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" font-size="11" fill="#34d399">v0.1.0  open source</text>
  </g>

  <!-- Flow diagram (centre) -->
  <g transform="translate(0, 180)" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace">

    <!-- USER PROMPT box -->
    <g transform="translate(60, 130)">
      <rect x="0" y="0" width="170" height="80" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="0" y="0" width="170" height="80" rx="6" fill="rgba(8,51,68,0.4)"/>
      <text x="85" y="28" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="600">USER PROMPT</text>
      <text x="85" y="50" text-anchor="middle" font-size="10" fill="#cbd5e1">"Summarise this</text>
      <text x="85" y="64" text-anchor="middle" font-size="10" fill="#cbd5e1">article."</text>
    </g>

    <!-- MODELDIRECTOR engine (centre) -->
    <g transform="translate(450, 80)">
      <rect x="0" y="0" width="300" height="180" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <rect x="0" y="0" width="300" height="180" rx="10" fill="rgba(6,78,59,0.25)"/>
      <text x="150" y="32" text-anchor="middle" font-size="13" fill="#34d399" font-weight="700">ModelDirector</text>
      <text x="150" y="50" text-anchor="middle" font-size="10" fill="#94a3b8">selector + policy engine</text>

      <!-- inner blocks -->
      <g transform="translate(30, 70)">
        <rect x="0" y="0" width="240" height="38" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8"/>
        <text x="120" y="24" text-anchor="middle" font-size="10" fill="#a7f3d0">Selector LLM (e.g. claude-3.5-haiku)</text>
      </g>
      <g transform="translate(30, 118)">
        <rect x="0" y="0" width="240" height="38" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8"/>
        <text x="120" y="24" text-anchor="middle" font-size="10" fill="#a7f3d0">Policy: cheapest_capable / balanced</text>
      </g>
    </g>

    <!-- Three candidate model score lanes (right of engine) -->
    <g transform="translate(880, 60)">
      <!-- cheap -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="44" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="14" y="20" font-size="11" fill="#22d3ee" font-weight="600">gpt-4o-mini</text>
        <text x="14" y="34" font-size="9" fill="#64748b">conf 92 · cost 1</text>
        <text x="206" y="28" text-anchor="end" font-size="14" fill="#34d399" font-weight="700">✓</text>
      </g>
      <!-- mid -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="220" height="44" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="14" y="20" font-size="11" fill="#22d3ee" font-weight="600">claude-3.5-sonnet</text>
        <text x="14" y="34" font-size="9" fill="#64748b">conf 95 · cost 20</text>
      </g>
      <!-- premium -->
      <g transform="translate(0, 112)">
        <rect x="0" y="0" width="220" height="44" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="14" y="20" font-size="11" fill="#22d3ee" font-weight="600">claude-sonnet-4</text>
        <text x="14" y="34" font-size="9" fill="#64748b">conf 99 · cost 100</text>
      </g>
    </g>

    <!-- Arrows: prompt -> engine -->
    <line x1="240" y1="170" x2="445" y2="170" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>

    <!-- Arrows: engine -> each model -->
    <line x1="755" y1="135" x2="875" y2="82"  stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <line x1="755" y1="170" x2="875" y2="138" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <line x1="755" y1="205" x2="875" y2="194" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <!-- Arrows: each model -> engine (scores back) -->
    <line x1="875" y1="120" x2="755" y2="200" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="875" y1="176" x2="755" y2="210" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="875" y1="232" x2="755" y2="220" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>

  <!-- Bottom strip: policy decision -->
  <g transform="translate(60, 470)" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace">
    <text x="0" y="0" font-size="11" fill="#64748b" letter-spacing="0.1em">DECISION</text>
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="1080" height="60" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
      <rect x="0" y="0" width="1080" height="60" rx="6" fill="rgba(6,78,59,0.18)"/>
      <text x="20" y="36" font-size="13" fill="#e2e8f0" font-weight="600">
        <tspan fill="#34d399">gpt-4o-mini</tspan> selected
      </text>
      <text x="240" y="36" font-size="11" fill="#94a3b8">first model above threshold 80</text>
      <text x="1060" y="36" text-anchor="end" font-size="11" fill="#34d399">cost ≈ 1 / 100</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 600)" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace">
    <text x="0" y="0" font-size="10" fill="#475569">github.com/aniketkarne-com/ModelDirector  ·  MIT  ·  provider-agnostic  ·  stateless  ·  open source</text>
  </g>
</svg>
